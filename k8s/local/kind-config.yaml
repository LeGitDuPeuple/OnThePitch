# Cluster Kubernetes LOCAL (kind : Kubernetes dans Docker), pour la démonstration.
# Expose l'API et le site sur les mêmes ports que le développement — c'est
# imposé par l'application : l'URL de l'API est figée dans le build du front
# (localhost:3000) et l'origine CORS autorisée est localhost:5173.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: onthepitch
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30300, hostPort: 3000, listenAddress: "127.0.0.1" }   # API
      - { containerPort: 30573, hostPort: 5173, listenAddress: "127.0.0.1" }   # site
