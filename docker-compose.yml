services:

  db:
    image: postgis/postgis:16-3.4
    container_name: onthepitch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: onthepitch-api
    restart: unless-stopped
    env_file:
      # ENV_FILE permet à la CI d'utiliser un fichier jetable (voir
      # docker-compose.ci.yml et scripts/e2e.sh) sans toucher au .env de dev.
      - ${ENV_FILE:-.env}
    environment:
      # "localhost" ne veut rien dire dans le réseau Docker : "db" est le nom
      # du service ci-dessus, résolu automatiquement par Docker. Seule cette
      # variable diffère de .env (qui reste correct pour le développement local
      # sans conteneur, où "localhost" désigne bien la machine hôte).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./frontend
    container_name: onthepitch-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data: